# Nome do workflow exibido na aba Actions do GitHub
name: Backup para Dropbox

# Define quando o workflow será executado
on:
  # Executa automaticamente quando houver um push na branch main
  push:
    branches: ["main"]

  # Permite executar o backup manualmente pela interface do GitHub
  workflow_dispatch:

# Define as permissões concedidas ao GITHUB_TOKEN
permissions:
  # Permite apenas ler o conteúdo do repositório
  contents: read

jobs:
  backup:
    # Executa as etapas em uma máquina virtual Linux hospedada pelo GitHub
    runs-on: ubuntu-latest

    steps:
      # Baixa o conteúdo do repositório para o ambiente de execução
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Cria um arquivo ZIP contendo os arquivos versionados no commit, sem incluir o histórico do Git nem a pasta .git
      - name: Gerar ZIP sem histórico Git
        shell: bash
        run: |
          # Interrompe a execução se algum comando falhar
          set -euo pipefail

          # Cria a pasta onde o arquivo ZIP será armazenado
          mkdir -p dist

          # Exporta os arquivos versionados do commit atual para um ZIP. Os primeiros 12 caracteres do SHA identificam o commit
          git archive \
            --format=zip \
            --output="dist/setup-${GITHUB_SHA:0:12}.zip" \
            HEAD

      # Envia o arquivo ZIP para a pasta de backup no Dropbox
      - name: Enviar backup para Dropbox
        env:
          # Lê o token armazenado nos Repository secrets do GitHub
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}

          # SHA do commit que está sendo copiado
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Interrompe a execução se algum comando falhar
          set -euo pipefail

          # Define o caminho e o nome do arquivo ZIP
          FILE="dist/setup-${GITHUB_SHA:0:12}.zip"
          FILENAME="$(basename "$FILE")"

          # Monta os argumentos da API como JSON válido
          DROPBOX_API_ARG="$(jq -cn \
            --arg path "/Setup/${FILENAME}" \
            '{path: $path, mode: "add", autorename: false}')"

          # Envia o ZIP para o Dropbox
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://content.dropboxapi.com/2/files/upload" \
            --header "Authorization: Bearer ${DROPBOX_TOKEN}" \
            --header "Content-Type: application/octet-stream" \
            --header "Dropbox-API-Arg: ${DROPBOX_API_ARG}" \
            --data-binary "@${FILE}"
